org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.io.tmpdir=C:/Users/axelscrib/AppData/Local/Temp

# Java mengambil TMPDIR dari lingkungan. Di mesin ini shell MSYS kadang
# mengisinya dengan path gaya `/c/Users/...`, yang diterjemahkan Java menjadi
# `C:\c\Users\...` sehingga build gagal dengan "java.io.tmpdir is set to a
# directory that doesn't exist". Menyetel -Djava.io.tmpdir di atas menutup
# celah itu tanpa bergantung pada isi variabel lingkungan.
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── Perbaikan kunci berkas di Windows ──
# Di Windows, daemon Gradle + pemantau berkas (VFS watch) menahan handle ke
# folder build/app/intermediates, sehingga tugas cleanMergeReleaseAssets
# gagal dengan "Unable to delete directory ... Failed to delete some
# children". Mematikan keduanya membuat build berjalan di proses yang
# selesai sendiri dan tidak menahan handle.
org.gradle.daemon=false
org.gradle.vfs.watch=false
